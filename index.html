<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign-In Form</title>
    <link rel="stylesheet" href="assets/style.css">
</head>

<body>
    <div id="container">
        <header>
            <section>
                <h1 id="logo">ODIN</h1>
            </section>
            <p>Photo by <a
                    href="https://unsplash.com/@calw_px?utm_source=unsplash&utm_medium=referral&utm_content=creditCopyText">Calvin</a>
                on <a
                    href="https://unsplash.com/photos/granite-peak-in-huangshan-china-FUNWLd_5_oI?utm_source=unsplash&utm_medium=referral&utm_content=creditCopyText">Unsplash</a>
            </p>
        </header>
        <main>
            <h3>This is not a real online service! You know you need something like this in your life to help you
                realize your deepest dreams. Sign up <em>now</em> to get started.</h3>
            <h3>You <em>know</em> you want to.</h3>
            <div id="form-body">
                <h3>Let's do this</h3>
                <form action="">
                    <div class="first-row">
                        <label for="first">First Name:</label>
                        <input type="text" id="first" name="first">
                    </div>
                    <div class="second-row">
                        <label for="last">Last Name:</label>
                        <input type="text" id="last" name="last">
                    </div>
                    <div class="first-row">
                        <label for="mail">Email:</label>
                        <input type="email" id="mail" name="mail">
                    </div>
                    <div class="second-row">
                        <label for="phone">Phone Number:</label>
                        <input type="text" id="phone" name="phone">
                    </div>
                    <div class="first-row">
                        <label for="password">Password:</label>
                        <input type="password" id="password" name="password">
                    </div>
                    <div class="second-row">
                        <label for="confirm">Confirm Password:</label>
                        <input type="password" id="confirm" name="confirm">
                    </div>
            </div>
            <button type="submit">Create Account</button>
            <p>Already have an account? <a href="#">Log in</a></p>
            </form>
        </main>
    </div>
</body>

</html>
